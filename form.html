<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Laporan Data Lembaga MDTA - Pangandaran</title>
    <!-- Tailwind CSS untuk UI Profesional -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <!-- CONTAINER UTAMA -->
    <div class="max-w-xl mx-auto px-4 py-12 w-full flex-grow space-y-6">
        
        <!-- HEADER FORM -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-8 text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl text-xl font-bold mb-1 shadow-inner">
                🏫
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Form Laporan Data MDTA</h1>
            <p class="text-xs text-slate-500">Kabupaten Pangandaran &bull; Silakan isi data lembaga dengan benar dan valid.</p>
        </div>

        <!-- FORM INPUT UTAMA -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-8">
            <form onsubmit="kirimLaporanSekolah(event)" class="space-y-5">
                
                <!-- Nama Lembaga -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Nama Lembaga / MDTA</label>
                    <input type="text" id="namaLembaga" required placeholder="Contoh: MDTA Al-Huda" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm transition">
                </div>

                <!-- Pilihan Kecamatan -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Pilih Kecamatan</label>
                    <select id="pilihKecamatan" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm transition bg-white">
                        <option value="" disabled selected>-- Pilih Kecamatan --</option>
                        <option value="Parigi">Parigi</option>
                        <option value="Cijulang">Cijulang</option>
                        <option value="Cimerak">Cimerak</option>
                        <option value="Sidamulih">Sidamulih</option>
                        <option value="Pangandaran">Pangandaran</option>
                        <option value="Kalipucang">Kalipucang</option>
                        <option value="Padaherang">Padaherang</option>
                        <option value="Mangunjaya">Mangunjaya</option>
                        <option value="Langkaplancar">Langkaplancar</option>
                        <option value="Cigugur">Cigugur</option>
                    </select>
                </div>

                <!-- Grid Jumlah Guru & Siswa -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Jumlah Guru / Ustadz</label>
                        <input type="number" id="jumlahGuru" required min="1" placeholder="0" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Jumlah Siswa / Santri</label>
                        <input type="number" id="jumlahSiswa" required min="1" placeholder="0" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm transition">
                    </div>
                </div>

                <!-- Tombol Kirim -->
                <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3.5 px-4 rounded-xl text-sm transition shadow-lg shadow-blue-500/25">
                    Kirim Laporan Lembaga
                </button>
            </form>

            <!-- Status Notifikasi -->
            <div id="statusPesan" class="mt-4 text-center text-xs font-semibold hidden"></div>
        </div>

    </div>

    <!-- FOOTER -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 bg-white">
        Portal Pelaporan MDTA &copy; 2026 &bull; Kabupaten Pangandaran
    </footer>

    <!-- SKRIP FIREBASE & PENGIRIMAN DATA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDb, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzOfst74GWHTVVGY2L-H4K5-En8og",
            authDomain: "localvibe-eb252.firebaseapp.com",
            projectId: "localvibe-eb252",
            storageBucket: "localvibe-eb252.appspot.com",
            messagingSenderId: "15605656260",
            appId: "1:15605656260:web:bb3297b4386a8e80eaf971"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.kirimLaporanSekolah = async function(event) {
            event.preventDefault();
            
            const namaLembaga = document.getElementById('namaLembaga').value.trim();
            const kecamatan = document.getElementById('pilihKecamatan').value;
            const jumlahGuru = document.getElementById('jumlahGuru').value;
            const jumlahSiswa = document.getElementById('jumlahSiswa').value;
            const statusPesan = document.getElementById('statusPesan');
            const btnSubmit = document.getElementById('btnSubmit');

            if (!namaLembaga || !kecamatan) {
                alert("Semua kolom harus diisi!");
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "Mengirim data...";
            statusPesan.classList.remove('hidden', 'text-red-600', 'text-emerald-600');
            statusPesan.classList.add('text-slate-500');
            statusPesan.innerText = "Sedang mengirim laporan ke server...";

            try {
                // Membuat dokumen baru dengan ID otomatis di koleksi "lembaga_sekolah"
                const newDocRef = doc(collection(db, "lembaga_sekolah"));
                await setDoc(newDocRef, {
                    nama_lembaga: namaLembaga,
                    kecamatan: kecamatan,
                    jumlah_guru: jumlahGuru,
                    jumlah_siswa: jumlahSiswa,
                    waktu_input: new Date().toISOString()
                });

                statusPesan.classList.remove('text-slate-500');
                statusPesan.classList.add('text-emerald-600');
                statusPesan.innerText = "Berhasil! Laporan lembaga telah tersimpan ke server pusat.";
                
                // Reset Form
                document.getElementById('namaLembaga').value = "";
                document.getElementById('pilihKecamatan').selectedIndex = 0;
                document.getElementById('jumlahGuru').value = "";
                document.getElementById('jumlahSiswa').value = "";

            } catch (error) {
                console.error("Error kirim:", error);
                statusPesan.classList.remove('text-slate-500');
                statusPesan.classList.add('text-red-600');
                statusPesan.innerText = "Gagal mengirim laporan: " + error.message;
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Kirim Laporan Lembaga";
            }
        };
    </script>
</body>
</html>
